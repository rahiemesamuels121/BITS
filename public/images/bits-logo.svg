  <title id="logo-title">BITS - innovation sail logo</title>
  <desc id="logo-desc">A minimalist teal and orange pair of forward sails over a cyan geometric lower panel. A black technology and innovation bulb icon sits at half its former size in the open lower left position.</desc>
